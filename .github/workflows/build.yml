name: Build unsigned IPA (TrollStore)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project TingShu.xcodeproj \
            -scheme TingShu \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA for TrollStore
        run: |
          APP_PATH=$(find build -name "TingShu.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then echo "TingShu.app not found"; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry TingShu-unsigned.ipa Payload
          ls -lh TingShu-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TingShu-unsigned-ipa
          path: TingShu-unsigned.ipa
          retention-days: 30
